<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/space-grotesk/SpaceGrotesk-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/dm-sans/DMSans-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <title>CCS Connect Mobile App</title>
    <link rel="preload" href="/branding/school-logo.png" as="image" />
    <style>
      html, body { margin: 0; background: #50131c; }
      #startup-artwork { position: fixed; inset: 0; z-index: 2147483647; overflow: hidden;

      #startup-artwork img { position: absolute; left: 50%; top: 45.625%; width: 41.666667%; height: auto; transform: translate(-50%, -50%); }

  <body>
    <div id="root"><div id="startup-artwork" aria-hidden="true"><div class="startup-plane"><img src="/branding/school-logo.png" alt="" /></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
